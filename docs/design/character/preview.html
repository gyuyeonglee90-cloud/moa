const PALETTE = {
  lime:['#E4FBC9','#8FE05A','#3FB82E','라임'], pink:['#FFE0F3','#FF9AD8','#FF64C8','핑크'],
  coral:['#FFE1DA','#FF8A7A','#F0503C','코랄'], sky:['#DDEEFF','#8CC4F5','#3D8FE0','하늘'],
  sun:['#FFF3CC','#FFD36B','#FFAE1A','해바라기'], lavender:['#F2E8FD','#D6B6F6','#9B6FD6','라벤더']};
const PARTS = ['hair','eyeL','eyeR','cheek','mouth'];
let uid = 0;

/* 흔적 규칙 (PRD 5-3): 미인증 누적 n회 */
function traceOf(n){
  return { scale: n<1 ? 1 : Math.min(2, 1.25 + 0.1*Math.max(0, n-3)), rotate: n>=2 ? 15 : 0, wavy: n>=3 };
}

/* 레퍼런스 구현
   state = { template, color, bodyRate(0~1), parts:{hair:{progress(0~1), miss(int)}, ...}, sparks(0~7), goalOnly } */
function renderCharacter(state){
  const doc = new DOMParser().parseFromString(FILES[`template-${state.template}.svg`], 'image/svg+xml');
  const svg = doc.documentElement;
  const sfx = '-' + (uid++);
  // 1) id 고유화 (화면에 여러 캐릭터가 있을 때 필수)
  svg.querySelectorAll('[id^="moa-"]').forEach(el => el.id += sfx);
  svg.querySelectorAll('[clip-path],[fill],[filter]').forEach(el => {
    for (const a of ['clip-path','fill','filter']) {
      const v = el.getAttribute(a); if (v && v.startsWith('url(#moa-')) el.setAttribute(a, v.replace(')', sfx + ')'));
    }
  });
  // 2) 색
  const c = PALETTE[state.color];
  svg.setAttribute('style', `--char-light:${c[0]};--char-base:${c[1]};--char-deep:${c[2]}`);
  // 3) 몸통 차오름
  const body = svg.querySelector('#body');
  const top = +body.dataset.top, bot = +body.dataset.bottom;
  const rate = state.goalOnly ? 0 : state.bodyRate;
  const y = bot - (bot - top) * rate;
  const rect = svg.querySelector(`[id^="moa-"][id$="fillrect${sfx}"]`);
  rect.setAttribute('y', y); rect.setAttribute('height', 200 - y);
  if (rate >= 1) body.querySelector('.goal').style.display = 'none';
  // 4) 부위
  for (const k of PARTS) {
    const ps = (state.parts||{})[k] || {progress:0, miss:0};
    const p = state.goalOnly ? 0 : ps.progress;
    const t = traceOf(state.goalOnly ? 0 : ps.miss);
    const normal = svg.querySelector('#'+k), wavy = svg.querySelector('#'+k+'-wavy');
    normal.style.display = t.wavy ? 'none' : ''; wavy.style.display = t.wavy ? '' : 'none';
    const g = t.wavy ? wavy : normal;
    const cx = g.dataset.cx, cy = g.dataset.cy;
    g.setAttribute('transform', `translate(${cx} ${cy}) rotate(${t.rotate}) scale(${t.scale}) translate(${-cx} ${-cy})`);
    g.querySelectorAll('.ink').forEach(el => { el.setAttribute('stroke-dasharray', `${p*100} 100`); if (p===0) el.style.display='none'; });
    g.querySelectorAll('.fill').forEach(el => { const o = +(el.getAttribute('opacity') || 1); el.setAttribute('opacity', o * p); });
    if (p >= 1) g.querySelectorAll('.goal').forEach(el => el.style.display = 'none');
  }
  // 5) 좋은 흔적
  const n = state.goalOnly ? 0 : (state.sparks || 0);
  if (n) {
    const fx = new DOMParser().parseFromString(FILES['fx-sparkle.svg'], 'image/svg+xml').documentElement;
    fx.querySelectorAll('.spark').forEach((s, i) => { if (i < n) svg.appendChild(document.importNode(s, true)); });
  }
  return new XMLSerializer().serializeToString(svg);
}

const full = Object.fromEntries(PARTS.map(k => [k, {progress:1, miss:0}]));
const STATES = [
  ['목표 (점선)', {goalOnly:true}],
  ['진행 50%', {bodyRate:.5, parts:{hair:{progress:.6,miss:0}, eyeL:{progress:.5,miss:0}, eyeR:{progress:0,miss:0}, cheek:{progress:.4,miss:0}, mouth:{progress:.7,miss:0}}}],
  ['완성', {bodyRate:1, parts:full}],
  ['흔적 예시', {bodyRate:1, sparks:3, parts:{...full, eyeL:{progress:1,miss:1}, mouth:{progress:1,miss:2}, cheek:{progress:1,miss:3}}}],
];
let html = '';
for (const tp of ['round','soft','chubby']) {
  html += `<h2>template-${tp}</h2><table><tr><th></th>${STATES.map(s=>`<th>${s[0]}</th>`).join('')}</tr>`;
  for (const col of Object.keys(PALETTE)) {
    html += `<tr><th>${PALETTE[col][3]}</th>` + STATES.map(([_, s]) => `<td class="hero">${renderCharacter({template:tp, color:col, ...s})}</td>`).join('') + '</tr>';
  }
  html += '</table>';
}
html += `<h2>흔적 단계 (입, 동글·라임)</h2><table><tr>${[0,1,2,3,5,10].map(n=>`<th>미인증 ${n}회</th>`).join('')}</tr><tr>` +
  [0,1,2,3,5,10].map(n => `<td>${renderCharacter({template:'round', color:'lime', bodyRate:1, parts:{...full, mouth:{progress:1, miss:n}}})}</td>`).join('') + '</tr></table>';
html += `<h2>좋은 흔적 7개 좌표</h2><table><tr><td style="width:30%">${renderCharacter({template:'round', color:'sky', bodyRate:1, parts:full, sparks:7})}</td><td class="legend">spark-1 (178,44) · 2 (22,66) · 3 (186,122) · 4 (14,150) · 5 (150,14) · 6 (46,18) · 7 (180,180)</td></tr></table>`;
document.getElementById('out').innerHTML = html;
</script>
