<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOA 캐릭터 미리보기</title>
<!-- 자동 생성 파일: 이 폴더의 SVG 내용을 인라인으로 복사해 둔 미리보기. file:// 로 바로 열 수 있음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#FFF8F2;--surface:#FFFFFF;--line:#F0E6DD;--t1:#2B2438;--t2:#6B6378;--t3:#A39CAD;--point:#6A5AE0;--point-soft:#EEEBFF}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--t1);font-family:Pretendard,-apple-system,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:32px 16px 80px}
  h1{font-size:28px;margin:0 0 4px} h2{font-size:20px;margin:40px 0 12px}
  p.sub{color:var(--t2);margin:0 0 24px}
  .builder{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
  @media (max-width:760px){.builder{grid-template-columns:1fr}}
  .stage-box{background:var(--surface);border-radius:28px;box-shadow:0 8px 24px rgba(61,52,80,.08);padding:16px;position:relative}
  .stage-box svg{width:100%;height:auto;display:block}
  .controls{display:flex;flex-direction:column;gap:14px}
  .row label{display:block;font-size:13px;color:var(--t2);margin-bottom:6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--t1)}
  .chip[aria-pressed=true]{border-color:var(--point);background:var(--point-soft);color:var(--point);font-weight:700}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
  .sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--point)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .cell{background:var(--surface);border-radius:20px;padding:8px;text-align:center;font-size:12px;color:var(--t2)}
  .cell svg{width:100%;height:auto;display:block}
  .fx-on .spk{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .fx-on .spk-2{animation-delay:.4s}.fx-on .spk-3{animation-delay:.8s}.fx-on .spk-4{animation-delay:1.2s}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
  .fx-on .combo{animation:floatup 2.4s ease-out infinite;transform-box:fill-box}
  .fx-on .combo-2{animation-delay:.8s}.fx-on .combo-3{animation-delay:1.6s}
  @keyframes floatup{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
  .anchor circle{fill:none;stroke:#FF3B6B;stroke-width:1.2}
  .anchor text{font-size:6px;fill:#FF3B6B}
</style>
</head>
<body>
<main>
  <h1>MOA 캐릭터 미리보기</h1>
  <p class="sub">viewBox 0 0 200 200 · 몸통은 currentColor · 파츠는 단계 배율로 같이 축소 (스펙 3장 참고)</p>

  <section class="builder">
    <div class="stage-box fx-on" id="big"></div>
    <div class="controls" id="controls"></div>
  </section>

  <h2>몸통 × 단계 (현재 파츠 조합)</h2>
  <div class="grid" id="g-stage"></div>

  <h2>6색</h2>
  <div class="grid" id="g-color"></div>

  <h2>파츠 × 몸통 (완성 단계)</h2>
  <div class="grid" id="g-parts"></div>

  <h2>표정 (기분)</h2>
  <div class="grid" id="g-face"></div>
</main>

0 C86 22 64 26 66 40 C76 50 92 48 100 40 Z\" fill=\"#8FE0B4\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<path d=\"M100 38 C112 16 140 18 138 34 C128 48 108 46 100 38 Z\" fill=\"#8FE0B4\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n", "part-hat-4": "<!-- hat 4 리본 -->\n<path d=\"M100 58 C82 36 62 42 68 58 C72 72 90 66 100 58 Z\" fill=\"#FF8FA3\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<path d=\"M100 58 C118 36 138 42 132 58 C128 72 110 66 100 58 Z\" fill=\"#FF8FA3\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<circle cx=\"100\" cy=\"58\" r=\"8\" fill=\"#FF6F8A\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n", "part-prop-1": "<!-- prop 1 꽃 -->\n<path d=\"M158 150 Q160 120 166 94\" stroke=\"#3FAF7A\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<path d=\"M162 124 q10 -8 14 -2 q-6 8 -14 2 Z\" fill=\"#8FE0B4\" stroke=\"#3D3450\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\n<circle cx=\"166.0\" cy=\"79.0\" r=\"7\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n<circle cx=\"174.6\" cy=\"85.2\" r=\"7\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n<circle cx=\"171.3\" cy=\"95.3\" r=\"7\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n<circle cx=\"160.7\" cy=\"95.3\" r=\"7\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n<circle cx=\"157.4\" cy=\"85.2\" r=\"7\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n<circle cx=\"166\" cy=\"88\" r=\"5.5\" fill=\"#FF9F6B\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n", "part-prop-2": "<!-- prop 2 풍선 -->\n<path d=\"M158 146 Q172 118 166 84\" stroke=\"#3D3450\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n<ellipse cx=\"168\" cy=\"62\" rx=\"17\" ry=\"20\" fill=\"#9CCBFF\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<path d=\"M164 84 l4 -3 l4 3 Z\" fill=\"#9CCBFF\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<ellipse cx=\"161\" cy=\"54\" rx=\"4\" ry=\"6\" transform=\"rotate(20 161 54)\" fill=\"#FFFFFF\" opacity=\"0.7\"/>\n", "part-prop-3": "<!-- prop 3 깃발 -->\n<path d=\"M160 152 V84\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<path d=\"M160 86 L190 98 L160 110 Z\" fill=\"#6A5AE0\" stroke=\"#3D3450\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/>\n<circle cx=\"160\" cy=\"82\" r=\"4\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2.5\"/>\n", "part-prop-4": "<!-- prop 4 별봉 -->\n<path d=\"M154 152 L170 104\" stroke=\"#3D3450\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<path d=\"M172.0 77.0 L176.1 86.3 L186.3 87.4 L178.7 94.2 L180.8 104.1 L172.0 99.0 L163.2 104.1 L165.3 94.2 L157.7 87.4 L167.9 86.3 Z\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/>\n<circle cx=\"190\" cy=\"76\" r=\"2.5\" fill=\"#FFD97A\"/><circle cx=\"152\" cy=\"74\" r=\"2\" fill=\"#FFD97A\"/>\n", "fx-sparkle": "<!-- fx sparkle - stage3 완성형 반짝이. .spk-N 그룹별로 깜빡임 애니메이션 -->\n<g class=\"spk spk-1\"><path d=\"M34 39 Q37.08 46.92 45 50 Q37.08 53.08 34 61 Q30.92 53.08 23 50 Q30.92 46.92 34 39 Z\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2\" stroke-linejoin=\"round\"/></g>\n<g class=\"spk spk-2\"><path d=\"M150 13 Q151.96 18.04 157 20 Q151.96 21.96 150 27 Q148.04 21.96 143 20 Q148.04 18.04 150 13 Z\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2\" stroke-linejoin=\"round\"/></g>\n<g class=\"spk spk-3\"><path d=\"M20 121 Q21.96 126.04 27 128 Q21.96 129.96 20 135 Q18.04 129.96 13 128 Q18.04 126.04 20 121 Z\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2\" stroke-linejoin=\"round\"/></g>\n<g class=\"spk spk-4\"><path d=\"M184 159 Q186.52 165.48 193 168 Q186.52 170.52 184 177 Q181.48 170.52 175 168 Q181.48 165.48 184 159 Z\" fill=\"#FFD97A\" stroke=\"#3D3450\" stroke-width=\"2\" stroke-linejoin=\"round\"/></g>\n", "fx-combo": "<!-- fx combo - 크루 콤보 진행 중 이펙트. .combo-N 그룹은 위로 떠오르는 루프 -->\n<ellipse cx=\"100\" cy=\"182\" rx=\"84\" ry=\"12\" stroke=\"#6A5AE0\" stroke-width=\"3\" stroke-dasharray=\"2 9\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n<g class=\"combo combo-1\"><path d=\"M28 102.3 C16.799999999999997 95.3 21.7 86.9 28 92.85 C34.3 86.9 39.2 95.3 28 102.3 Z\" fill=\"#FF8FA3\"/></g>\n<g class=\"combo combo-2\"><path d=\"M178 133.4 C168.4 127.4 172.6 120.2 178 125.3 C183.4 120.2 187.6 127.4 178 133.4 Z\" fill=\"#B7A8FF\"/></g>\n<g class=\"combo combo-3\"><path d=\"M40 164.5 C32.0 159.5 35.5 153.5 40 157.75 C44.5 153.5 48.0 159.5 40 164.5 Z\" fill=\"#FFD97A\"/></g>\n"};
const COLORS = {peach:'#FFB89E',butter:'#FFD97A',mint:'#9DE3C6',sky:'#9CCBFF',lilac:'#C3B4FF',pink:'#FFB5D3'};
const K = {1:.62,2:.82,3:1};
const S = {body:'round',stage:3,color:'peach',hat:1,eyes:1,cheek:1,prop:1,face:'happy',combo:false,anchor:false};

function compose(o){
  const col = COLORS[o.color];
  let g = '';
  if(o.stage===0){ g = D['egg']; }
  else{
    const k = K[o.stage];
    const t = k===1?'':` transform="translate(100 178) scale(${k}) translate(-100 -178)"`;
    let parts = '';
    if(o.cheek) parts += D['part-cheek-'+o.cheek];
    parts += D['face-'+o.face];
    if(o.eyes) parts += D['part-eyes-'+o.eyes];
    if(o.stage>=2){ if(o.hat) parts += D['part-hat-'+o.hat]; if(o.prop) parts += D['part-prop-'+o.prop]; }
    if(o.anchor) parts += `<g class="anchor"><circle cx="100" cy="62" r="3"/><text x="104" y="60">HAT 100,62</text><circle cx="78" cy="106" r="3"/><circle cx="122" cy="106" r="3"/><text x="126" y="104">EYE</text><circle cx="63" cy="124" r="3"/><circle cx="137" cy="124" r="3"/><circle cx="100" cy="126" r="3"/><text x="104" y="136">MOUTH</text><circle cx="160" cy="140" r="3"/><text x="164" y="146">HAND</text></g>`;
    g = D[`body-${o.body}-stage${o.stage}`] + `<g${t}>${parts}</g>`;
    if(o.stage===3) g += D['fx-sparkle'];
  }
  if(o.combo) g = D['fx-combo'] + g;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="color:${col}">${g}</svg>`;
}

const ctrlDefs = [
  ['body','몸통',[['round','동글'],['soft','말랑'],['spiky','뾰족']]],
  ['stage','단계',[[0,'0 알'],[1,'1 아기'],[2,'2 성장'],[3,'3 완성']]],
  ['face','기분',[['happy','😆 100%'],['normal','🙂 50%+'],['sad','🥺 50%-']]],
  ['hat','모자',[[0,'없음'],[1,'비니'],[2,'고깔'],[3,'새싹'],[4,'리본']]],
  ['eyes','눈',[[0,'없음'],[1,'동글눈'],[2,'반짝눈'],[3,'웃는눈'],[4,'안경']]],
  ['cheek','볼터치',[[0,'없음'],[1,'발그레'],[2,'빗금'],[3,'하트'],[4,'주근깨']]],
  ['prop','소품',[[0,'없음'],[1,'꽃'],[2,'풍선'],[3,'깃발'],[4,'별봉']]],
  ['combo','콤보 이펙트',[[false,'끔'],[true,'켬']]],
  ['anchor','기준점 표시',[[false,'끔'],[true,'켬']]],
];
function renderControls(){
  const c = document.getElementById('controls'); c.innerHTML='';
  const cr = document.createElement('div'); cr.className='row';
  cr.innerHTML = '<label>색</label><div class="chips">'+Object.entries(COLORS).map(([k,v])=>`<button class="sw" title="${k}" style="background:${v}" aria-pressed="${S.color===k}" data-k="color" data-v="${k}"></button>`).join('')+'</div>';
  c.appendChild(cr);
  for(const [key,label,opts] of ctrlDefs){
    const r = document.createElement('div'); r.className='row';
    r.innerHTML = `<label>${label}</label><div class="chips">`+opts.map(([v,l])=>`<button class="chip" aria-pressed="${S[key]===v}" data-k="${key}" data-v='${JSON.stringify(v)}'>${l}</button>`).join('')+'</div>';
    c.appendChild(r);
  }
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; S[k] = k==='color'?b.dataset.v:JSON.parse(b.dataset.v); render();
  });
}
function cell(o,label){return `<div class="cell fx-on">${compose(o)}${label}</div>`}
function render(){
  renderControls();
  document.getElementById('big').innerHTML = compose(S);
  let h='';
  for(const b of ['round','soft','spiky']) for(const st of [0,1,2,3]) h+=cell({...S,body:b,stage:st,anchor:false},`${b} · stage${st}`);
  document.getElementById('g-stage').innerHTML=h;
  h=''; for(const c of Object.keys(COLORS)) h+=cell({...S,color:c,anchor:false},c);
  document.getElementById('g-color').innerHTML=h;
  h='';
  for(const cat of ['hat','eyes','cheek','prop']) for(const i of [1,2,3,4]) for(const b of ['round','soft','spiky']){
    const o={...S,body:b,stage:3,hat:0,eyes:1,cheek:0,prop:0,face:'normal',anchor:false,combo:false}; o[cat]=i;
    h+=cell(o,`${cat}-${i} · ${b}`);
  }
  document.getElementById('g-parts').innerHTML=h;
  h=''; for(const f of ['happy','normal','sad']) for(const b of ['round','soft','spiky']) h+=cell({...S,body:b,face:f,anchor:false},`${f} · ${b}`);
  document.getElementById('g-face').innerHTML=h;
}
render();
</script>
